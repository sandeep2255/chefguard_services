version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: chefguard
      MYSQL_DATABASE: chefguard
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init-scripts:/docker-entrypoint-initdb.d
  nodejs:
    build: .
    container_name: node-container
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: chefguard
      DB_NAME: chefguard

volumes:
  mysql_data:

